DATASET:
  ROOT: /home/hongsheng/vod/view_of_delft_PUBLIC
  SPLIT: val
  NUM_SAMPLES: 8
  RADAR_FOLDER: radar_5frames
  POINT_CLOUD_RANGE: [0.0, -25.6, -3.0, 51.2, 25.6, 2.0]
  GRID_SIZE: [128, 128]
  CLASSES: [Car, Pedestrian, Cyclist]
  MAX_GT: 128
  RADAR_MEAN: [0.0, 0.0, 0.0, -13.0, -3.0, -0.1, 0.0]
  RADAR_STD: [1.0, 1.0, 1.0, 14.0, 8.0, 6.0, 1.0]

MODEL:
  LIDAR_CHANNELS: 32
  RADAR_CHANNELS: 32
  FUSER:
    NAME: TaskAwareDecControlledA2Fusion
    KEY_FEATS: [spatial_features_2d, bev_feat]
    DIM_FEATS: [32, 32]
    TO_EMBED:
      METHOD: Linear1
      ACTIVATION: Identity
      N_LAYER: 1
      LAYER_NORM: true
      DIM_COMMON: 64
    UCP:
      METHOD: LinearN
      ACTIVATION: GELU
      N_LAYER: 2
      LAYER_NORM: true
      N_QUERY: 8
      PATCH_SIZE: [2, 2]
      DIM_PATCH: 64
    N_HEADS_MHA: 4
    PFT:
      METHOD: LinearN
      ACTIVATION: GELU
      N_LAYER: 2
      LAYER_NORM: true
    POST_CHANNEL: true
    PATCH_DEC_ENABLED: true
    PATCH_DEC_SELECTION: gt_foreground
    PATCH_DEC_FG_MARGIN: 0.5
    PATCH_DEC_RES_SCALE: 0.06
    PATCH_DEC_LAMBDA_DECOUPLE: 0.08
    PATCH_DEC_LAMBDA_COMMON: 0.10
    PATCH_DEC_LAMBDA_UNIQUE: 0.01
    PATCH_DEC_WEIGHT: 0.10
    DEC_CONTROL_NUM_CLASSES: 3
    DEC_CONTROL_CONTEXT_MODE: class
    DEC_CONTROL_STRENGTH: 0.75
    DEC_CONTROL_SCALE_MIN: 0.5
    DEC_CONTROL_SCALE_MAX: 1.9
    DEC_CONTROL_GATE_INIT_BIAS: -0.6
    DEC_CONTROL_GATE_LOSS_WEIGHT: 0.15
    DEC_CONTROL_CLASS_LOSS_WEIGHT: 0.20
    DEC_CONTROL_QUERY_STRENGTH: 0.08
    DEC_CONTROL_FUSED_RES_STRENGTH: 0.03

SMOKE:
  BATCH_SIZE: 2
  STEPS: 2
  GPU: 3
  LR: 0.0005

